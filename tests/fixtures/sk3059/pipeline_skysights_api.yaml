argo-pipeline:
  pipelines:
    skysights-api:
      defaultBranch: main
      harborRepoName: skysights-api
      trigger:
        repoName: broker-wrapped
        triggerBranchGlob: "{main,release/**,hotfix/**}"
        disableTags: true
        type: github
      simpleSteps:
        steps:
          - - type: git-clone
              parameters:
                type: github
          - - type: harbor
              parameters:
                dockerfile: apps/broker-wrapped-api/Dockerfile
          - - name: gitops-update-integ
              type: argocd-deploy
              parameters:
                app-clusters: integ-east
                deployments-repo: app-deployments
                app-project: mobile
                app-name: skysights-api
          - - name: gitops-update-staging
              type: argocd-deploy
              parameters:
                app-clusters: staging-east
                deployments-repo: app-deployments
                app-project: mobile
                app-name: skysights-api
