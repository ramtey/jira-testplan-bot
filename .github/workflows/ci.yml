name: CI

# The suite is hermetic — no network, no real credentials. DATABASE_URL is the
# one thing it insists on: `init_engine` refuses to guess, so six tests fail
# without it even though every query is mocked. A throwaway URL satisfies that
# check without a database, which is why this workflow needs no repository
# secrets at all. Keep it that way: this repo is public.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The committed package-lock.json was generated on macOS and carries only
      # the darwin rollup/esbuild native binaries, so `npm ci` on Linux installs
      # none and `vite build` dies with "Cannot find module
      # @rollup/rollup-linux-x64-gnu" (npm/cli#4828). Fetch the Linux binaries at
      # exactly the versions the lockfile pinned — read from the installed tree
      # rather than hardcoded, so a dependency bump can't silently desync this.
      # --no-save keeps the lockfile untouched. The durable fix is a
      # platform-complete lockfile, which means regenerating it (and taking the
      # minor version bumps that come with it) on a deliberate dependency update.
      - name: Install Linux native binaries the lockfile omits
        run: |
          npm i --no-save --no-audit --no-fund \
            "@rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")" \
            "@esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version")"
      - run: npm run lint
      # Build too: eslint won't catch a broken import or a bad JSX edit.
      - run: npm run build
